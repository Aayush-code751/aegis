[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-redaction"
version = "1.0.0"
description = "Distribution-shift-certified risk control for PII redaction in document streams"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Aayush Bharat Mandavia", email = "mandaviaaayush@ieee.org" },
  { name = "Raghavendra Kamat", email = "rgkamat21@gmail.com" },
]
keywords = [
  "pii", "redaction", "conformal-prediction", "conformal-risk-control",
  "distribution-shift", "distributionally-robust-optimization",
  "anytime-valid-inference", "privacy", "de-identification",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Everything below is optional. The core pipeline, every theorem's
# implementation and every certificate in the paper run on numpy alone.
figures  = ["matplotlib>=3.7"]
gliner   = ["gliner>=0.2", "torch>=2.0", "transformers>=4.38"]
presidio = ["presidio-analyzer>=2.2", "spacy>=3.7"]
dev      = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.9"]
all      = ["aegis-redaction[figures,gliner,presidio,dev]"]

[project.urls]
Homepage = "https://github.com/aegis-redaction/aegis-finance"
Repository = "https://github.com/aegis-redaction/aegis-finance"
Issues = "https://github.com/aegis-redaction/aegis-finance/issues"

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = ["slow: excluded from the default run (deselect with '-m \"not slow\"')"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E741", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"experiments/*" = ["E402", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
